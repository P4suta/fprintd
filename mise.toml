# mise-managed toolchain for this project.
# Extends the global config at ~/.config/mise/config.toml (global tools stay available: rust, just,
# taplo, typos, lefthook, gh, ripgrep, fd, ...). This file pins what this project needs.

[tools]
rust = "stable"          # matches the global `rust = "stable"` symlink
tokei = "latest"         # SLOC measurement for the M0 ground-truth estimate
uv = "latest"            # runs the REUSE license linter via uvx (see `mise run reuse`)
cargo-nextest = "latest" # the test runner for `mise run test` and CI
bacon = "latest"         # the background check/test loop for `mise run watch`
committed = "latest"     # Conventional-Commits linter for the commit-msg hook (see lefthook.yml)

[env]
# Where upstream C/Rust references are cloned for reading + SLOC measurement.
# Kept out of the workspace (see .gitignore); populate with `mise run clone-ref`.
REFERENCE_DIR = "reference"

[tasks.clone-ref]
description = "M0: shallow-clone upstream libfprint + fprintd + the libfprint-rs FFI binding for reading/measurement"
run = "cargo xtask clone-ref"

[tasks.sloc]
description = "M0: measure upstream libfprint SLOC by subsystem (drivers / nbis / core) with tokei"
run = "cargo xtask sloc"

[tasks.hooks]
description = "Install the git hooks (see lefthook.yml)"
run = "lefthook install"

[tasks.lint]
description = "Repository rules a compiler does not enforce (no shell, no narration)"
run = "cargo xtask lint"

[tasks.test]
description = "Run the workspace tests with nextest (doctests run separately: `cargo test --doc`)"
run = "cargo nextest run --workspace --all-features"

[tasks.watch]
description = "Background check/clippy/test loop on save (bacon)"
run = "bacon"

[tasks.ci-annotate]
description = "Run clippy and emit a GitHub PR annotation for each finding"
run = "cargo xtask ci-annotate"

[tasks.reuse]
description = "Check REUSE/SPDX license compliance"
# `--with charset-normalizer` gives reuse a pure-Python encoding detector, so it needs no native
# libmagic (required on Windows; harmless on Linux).
run = "uvx --with charset-normalizer reuse lint"

# --- Docker: build + verify the Linux-only crates (shim, daemon) -------------
# The repo runs on Windows; the shim (C libfprint FFI) and daemon (system D-Bus) are Linux-only, so
# they are built and verified in a container with libfprint (with virtual drivers) built from
# source. See docker/.

[tasks.docker-build]
description = "Build the Linux dev/verify image (pinned libfprint w/ virtual drivers)"
run = "docker compose -f docker/docker-compose.yml build"

[tasks.docker-test]
description = "Run the whole workspace test suite (incl. Linux-only crates) in the container"
# `--exclude fprint-fp3`: its dev-only GVariant oracle pulls `zvariant/gvariant`, which upstream
# zvariant miscompiles once the daemon's `zvariant` D-Bus features unify onto the same build (only on
# Linux). fp3 is pure and fully covered by the Windows/macOS `check` job.
run = "docker compose -f docker/docker-compose.yml run --rm dev cargo test --workspace --all-features --exclude fprint-fp3"

[tasks.docker-shell]
description = "Interactive shell in the Linux dev container (repo bind-mounted at /work)"
run = "docker compose -f docker/docker-compose.yml run --rm dev bash"

[tasks.docker-daemon-verify]
description = "Hardware-free enroll+verify against fprintd over its D-Bus contract"
# The integration test stands up the real daemon on a private bus (its own dbus-daemon) with a
# virtual backend and drives Claim -> EnrollStart -> enroll-completed -> VerifyStart ->
# verify-match -> Release as a client would.
run = "docker compose -f docker/docker-compose.yml run --rm dev cargo test -p fprintd --test dbus_integration -- --nocapture"

[tasks.docker-hw-build]
description = "Build the real-sensor bring-up image (libfprint with a hardware driver, not just the virtual ones)"
# `LIBFPRINT_DRIVERS` is the whole point of this task: the default image builds virtual drivers
# only, so it can see a real sensor on the bus but has nothing to drive it with. Override the
# driver for a different sensor; keep the virtual ones so the image stays a superset of CI's.
# Distinct image tag (`fprintd-hw`), so this never displaces the one `docker-test` uses.
run = """docker compose -f docker/docker-compose.hw.yml build \
  --build-arg LIBFPRINT_DRIVERS=upekts,virtual_image,virtual_device,virtual_device_storage"""

[tasks.docker-hw-shell]
description = "Interactive shell in the bring-up container, with the host's USB bus passed through"
# Needs a sensor plugged in and `docker-hw-build` run first. Inside: `lsusb` to confirm the
# device is visible, then `mise run docker-hw-ground-truth` (below) for the libfprint check.
run = "docker compose -f docker/docker-compose.hw.yml run --rm hw bash"

[tasks.docker-hw-shim]
description = "Enroll+verify a real finger through the shim (fprint-backend-libfprint) — our Rust in the path"
# The step after `docker-hw-ground-truth`: same sensor, same libfprint, but driven through
# `Backend`/`Device` instead of libfprint's own example clients. What that adds is the shape the
# shim reports, the `Raw` (match-on-chip) template surviving the FP3 codec byte-for-byte, and the
# worker thread staying alive across an operation that blocks for twenty seconds on a finger.
#
# `G_MESSAGES_DEBUG=` overrides the service's `all`: the driver trace is ~1000 lines per run and
# buries both the swipe prompts and the verdict. DEBUG=1 puts it back for diagnosing a stall.
# `--features virtual` is not about virtual devices here — it is what exposes the FFI hook the
# byte-identity assertion needs. `--nocapture` is mandatory; the prompts are the test's stdout.
#
# FP_HW_NEGATIVE=1 adds a "a different finger must NOT match" check, at the cost of one more
# presentation. Worth it: without it the test cannot distinguish matching from always-yes.
run = """docker compose -f docker/docker-compose.hw.yml run --rm -T \
  -e FP_HW_NEGATIVE -e G_MESSAGES_DEBUG= hw \
  cargo test -p fprint-backend-libfprint --test hardware --features virtual \
  -- --ignored --nocapture"""

[tasks.docker-hw-daemon]
description = "Enroll+verify a real finger over the fprintd D-Bus contract — the whole stack, on hardware"
# The top of the bring-up ladder: `docker-hw-ground-truth` (libfprint alone) proves the sensor,
# `docker-hw-shim` proves our Backend/Device layer, and this proves the daemon — actor threads,
# the FP3 store round-trip, and the `net.reactivated.Fprint` vocabulary a desktop client speaks.
# It is `dbus_integration` (which does all of this against a virtual backend) with a real sensor
# in the socket.
#
# The daemon is served on the test's own private session bus, so this needs no D-Bus policy and
# cannot collide with a distro fprintd. See the test's module docs for what that does not cover.
run = """docker compose -f docker/docker-compose.hw.yml run --rm -T \
  -e FP_HW_NEGATIVE -e G_MESSAGES_DEBUG= hw \
  cargo test -p fprintd --test dbus_hardware -- --ignored --nocapture"""

[tasks.docker-hw-ground-truth]
description = "Enroll then verify a real finger through libfprint alone — no daemon, none of our Rust"
# The check that answers "is it the sensor, or is it us?" before any bring-up work starts. It
# drives libfprint's own example clients, so nothing from this workspace is in the path.
#
# The prompt-answering, the scratch path the template must not escape, and the reason `stdbuf` is
# required all live in `xtask/src/hardware.rs`. Takes a finger index, 0 through 9; default 6.
run = "cargo xtask hw-ground-truth"

[tasks.unit-verify]
description = "Check the systemd unit against real systemd: it parses, and Alias= takes the seat"
run = "cargo xtask unit-verify"

# Supply chain: advisories, the licence boundary, wildcard pins, source registries. cargo-deny is a
# CLI that reads Cargo.lock; adds no dependency.
[tasks.deny]
description = "Check the dependency graph: advisories, licences, wildcard pins, sources"
run = "cargo deny check"

# `reuse lint` accepts a custom LicenseRef-* identifier and crates.io does not. This checks the
# registry's own rules.
[tasks.publish-check]
description = "Check the published crates against the registry's rules: licence, deps, contents"
run = "cargo xtask publish-check"

# --- NBIS oracles: the stock C tools as the ground truth the ports are checked against --------
# Both DELIBERATELY regenerate frozen goldens; need reference/nbis-stock + Docker.
# See xtask/src/oracle.rs.

[tasks.clone-ref-nbis]
description = "Clone stock (public-domain) NIST NBIS for the BOZORTH3/MINDTCT oracles (git-ignored)"
run = "cargo xtask clone-ref-nbis"

[tasks.bozorth3-oracle]
description = "DELIBERATE: regenerate the BOZORTH3 golden corpus + scores from the stock C tool"
run = "cargo xtask bozorth3-oracle"

[tasks.mindtct-oracle]
description = "DELIBERATE: regenerate the MINDTCT golden corpus + minutiae/maps from the stock C tool"
run = "cargo xtask mindtct-oracle"

# --- Fuzzing: coverage-guided search behind the seeded sweeps -------------------------------
# DELIBERATE: needs a nightly toolchain and Docker, kept out of CI (nightly is a moving dependency).
# What a campaign finds is frozen as an ordinary test (crates/fprint-fp3/tests/regressions.rs).
# Pass a target and optional budget: `mise run fuzz fp3_from_bytes 300`.
# See fuzz/Cargo.toml for the wall that keeps libfuzzer-sys out of the published crates.

[tasks.fuzz]
description = "DELIBERATE: fuzz one target in the nightly container (`fuzz <target> [seconds]`)"
run = "cargo xtask fuzz"

# --- Mutation testing: which lines the tests do not defend ----------------------------------
# DELIBERATE because of its size: 5,784 mutants over the published crates, each a build and a test
# run. No container, nightly, or network. A pull request gets the same question asked of its own
# diff (minutes, not hours); see the `mutants` job in .github/workflows/ci.yml.
# Scope it down while working: `cargo mutants -f 'crates/fprint-bozorth3/src/cluster.rs'`.

[tasks.mutants]
description = "DELIBERATE: which lines the tests do not defend (`mutants <base-ref>` for that diff only)"
run = "cargo xtask mutants"
