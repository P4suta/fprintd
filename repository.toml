name = "fprintd"
summary = "Rust fingerprint service compatible with the fprintd D-Bus interface"
install = """
# Install the hardware-free demo from source.
git clone https://github.com/P4suta/fprintd.git
cd fprintd
cargo install --locked --path crates/fprint-cli
"""
usage = "fprint demo"
documentation_index = true
copyright = "fprintd (pure-Rust) contributors"
license = "MIT OR Apache-2.0"

