#
# CodeQL security analysis (Advanced Setup). Scans the Rust source and the repository's own GitHub
# Actions workflows, uploading results to Security > Code scanning. Advanced (not Default) setup
# keeps the language set, query suite, and SHA-pinned action versions in-repo under the same review
# as the code.
#
# Languages:
#   - rust    build-mode: none — the Rust analysis resolves the cargo workspace without a traced
#             build, so it needs no libfprint present for the Linux-only shim crate.
#   - actions the workflows under .github/workflows (CI injection / unsafe checkout / token scope).
name: CodeQL

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload SARIF to code scanning
      actions: read # read workflow metadata for code scanning
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:${{ matrix.language }}"
