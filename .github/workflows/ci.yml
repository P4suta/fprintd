#
# Required platform, compatibility, package, dependency, and license checks.
# Mutation and coverage measurements use the local developer commands.

name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.merge_group.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: repository checks and change selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters/ci.yml
          predicate-quantifier: some-with-excludes
          token: ''
      - name: Install the declared Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Repository rules
        run: cargo xtask lint
      - name: Repository task tests
        run: cargo test --locked -p xtask
      - name: Workflow lint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  check:
    name: check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-nextest
      - name: Rustfmt
        run: cargo fmt --all --check
      # `--all-features` covers the feature axis: fprint-backend-native's `usb`/nusb seam, the fp3
      # GVariant oracle, and mindtct's `unstable-diagnostics`.
      - name: Clippy (workspace, all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Windows-only re-run of clippy as inline PR annotations (the workspace builds there without
      # libfprint). The gate is the step above; this only annotates.
      - name: Annotate clippy findings on the PR
        if: matrix.os == 'windows-latest'
        run: cargo xtask ci-annotate
      # nextest for unit/integration tests (junit for the summary below); doctests run separately
      # because nextest does not carry them.
      - name: Test (workspace, all features)
        run: cargo nextest run --profile ci --workspace --all-features
      - name: Doctests
        run: cargo test --doc --workspace --all-features
      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        with:
          report_paths: target/nextest/ci/junit.xml
          annotate_only: true
      # Strict rustdoc for the cross-platform library surface. The two Linux-only crates document in
      # the `linux` job, where their cfg-gated modules and deps compile.
      - name: Rustdoc (library crates, warnings are errors)
        run: cargo doc --no-deps -p fprint-core -p fprint-fp3 -p fprint-bozorth3 -p fprint-mindtct -p fprint-backend-native -p fprint-integration -p fprint-driverkit
        env:
          RUSTDOCFLAGS: -D warnings

  linux:
    name: linux verify (Docker + libfprint)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The image builds libfprint v1.94.10 from source; the gha cache avoids rebuilding it every
      # run. docker-compose.yml names `fprintd-dev`, so every `run` below picks this up.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          tags: fprintd-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image cache above holds the libfprint build, nothing Rust. This job's `fprintd-target`
      # volume is empty each run, so sccache (167 MiB) carries the 109 third-party crate compilations
      # between runs. Keyed on the lockfile and the image; either moving invalidates the cache.
      # See docker/docker-compose.ci.yml.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .sccache
          key: sccache-linux-${{ hashFiles('Cargo.lock', 'docker/Dockerfile') }}
          restore-keys: sccache-linux-
      - name: Clippy the whole workspace (incl. shim & daemon)
        run: >
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml run --rm dev
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test the whole workspace (incl. shim & daemon)
        run: >
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml run --rm dev
          cargo test --workspace --all-features
      # These two crates only build on Linux, so this is the only place their intra-doc links are
      # checked.
      - name: Rustdoc (Linux-only crates, warnings are errors)
        run: >
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml run --rm
          -e RUSTDOCFLAGS=-D\ warnings dev
          cargo doc --no-deps --all-features -p fprintd -p fprint-backend-libfprint
      # Covered by --all-features above; named separately as the M2 FP3 byte-identity proof against
      # the real C library: Raw via virtual_device, NBIS via virtual_image.
      - name: Shim vs. real libfprint virtual drivers (M2 FP3 byte-identity)
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml run --rm dev \
            cargo test -p fprint-backend-libfprint --features virtual \
              --test virtual --test virtual_image
      # Prints the cache hit rate. Dependencies should hit and the workspace's own ten crates should
      # miss; a run that misses everything means the key is churning.
      - name: sccache hit rate
        if: always()
        run: >
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml run --rm dev
          sccache --show-stats

  unit:
    name: systemd unit (Alias takes the seat)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify the unit against real systemd
        run: cargo xtask unit-verify

  msrv:
    name: msrv (1.82, published pure crates)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins stable for a bare `cargo`. RUSTUP_TOOLCHAIN outranks the file, so
      # the 1.82 floor is the one under test.
      RUSTUP_TOOLCHAIN: "1.82"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the minimum Rust toolchain
        run: rustup toolchain install 1.82 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The Linux-only crates are absent: they declare higher Rust floors. Their floor is
      # enforced by cargo's `rust-version` and exercised by `linux`.
      - name: Check the pure crates on the declared MSRV
        run: >
          cargo check --locked
          -p fprint-core -p fprint-fp3 -p fprint-bozorth3 -p fprint-mindtct -p fprint-backend-native

  publish:
    name: publish-check (the registry's rules)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the declared Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # publish-check dry-runs `cargo publish --workspace`, which builds the shim crate; its
      # libfprint-sys FFI links libfprint-2 and glib-2.0 through pkg-config.
      - name: install libfprint
        run: sudo apt-get update && sudo apt-get install -y libfprint-2-dev
      - name: Check the published crates package, strip and ship what they claim
        run: cargo xtask publish-check

  deny:
    name: supply chain (advisories, licences, bans, sources)
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5

  codeql:
    name: selected code analysis (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # read workflow metadata for code scanning
      security-events: write # upload the selected source analysis
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze selected source
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:${{ matrix.language }}"

  ci-required:
    name: ci-required
    if: always()
    needs: [changes, check, linux, unit, msrv, publish, deny, reuse, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require success from every verification job
        env:
          ALL_REQUIRED_PASSED: >-
            ${{ needs.changes.result == 'success' && needs.reuse.result == 'success' && (
            (needs.changes.outputs.runtime == 'true' &&
            needs.check.result == 'success' && needs.linux.result == 'success' &&
            needs.unit.result == 'success' && needs.msrv.result == 'success' &&
            needs.publish.result == 'success' && needs.deny.result == 'success' &&
            needs.codeql.result == 'success') ||
            (needs.changes.outputs.runtime == 'false' &&
            needs.check.result == 'skipped' && needs.linux.result == 'skipped' &&
            needs.unit.result == 'skipped' && needs.msrv.result == 'skipped' &&
            needs.publish.result == 'skipped' && needs.deny.result == 'skipped' &&
            needs.codeql.result == 'skipped')) }}
        run: test "$ALL_REQUIRED_PASSED" = true

  required:
    name: required
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the successful verification summary
        env:
          RESULT: ${{ needs.ci-required.result }}
        run: test "$RESULT" = success
