#
# Release changes require a reviewed PR under release-plz.toml.
# Registry publication uses Trusted Publishing in the release environment.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: read # Read source under docs/adr/sync-release-app-credentials-to-the-protected-environment.md.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    if: >-
      github.event_name == 'push' &&
      github.repository_id == '1304353893' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # The App token authorizes writes under docs/adr/sync-release-app-credentials-to-the-protected-environment.md.
      id-token: write # Keep registry OIDC under docs/adr/sync-release-app-credentials-to-the-protected-environment.md.
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz reads the full tag history to derive the bump
          persist-credentials: false
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Refresh the package index
        run: sudo apt-get update
      - name: Install native library development packages
        run: sudo apt-get install -y libfprint-2-dev libclang-dev pkg-config
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fprintd
          permission-contents: write
          permission-pull-requests: read
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    name: release-plz pr
    if: >-
      github.event_name == 'push' &&
      github.repository_id == '1304353893' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # The App token authorizes proposal writes under docs/adr/sync-release-app-credentials-to-the-protected-environment.md.
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Refresh the package index
        run: sudo apt-get update
      - name: Install native library development packages
        run: sudo apt-get install -y libfprint-2-dev libclang-dev pkg-config
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: fprintd
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
