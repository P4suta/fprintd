#
# Release automation via release-plz. On push to main:
#   - release-plz-pr:      opens/updates the Release PR (version bump + CHANGELOG) from the
#                          Conventional Commits since the last tag.
#   - release-plz-release: on Release PR merge, publishes the changed crates in dependency order
#                          and cuts the git tag + GitHub release. cargo-semver-checks gates breaking
#                          API changes (release-plz.toml).
#
# Auth is environment-scoped (the `release` GitHub Environment), never repo-level secrets:
#   - A GitHub App mints a short-lived token via actions/create-github-app-token, so the Release PR
#     it opens is authored by the App and retriggers CI (a GITHUB_TOKEN-authored PR does not). Set
#     RELEASE_PLZ_APP_ID and RELEASE_PLZ_APP_PRIVATE_KEY in the `release` environment; the App needs
#     Contents: read/write and Pull requests: read/write, installed on this repository.
#   - crates.io publish uses Trusted Publishing (OIDC) via `id-token: write`, not a stored token.
#     Register a trusted publisher for each published crate on crates.io (owner P4suta, repo
#     fprintd, workflow release.yml, environment release). A brand-new crate's first publish must be
#     done once with a token; OIDC covers every release after that.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish + GitHub release. Runs on every push to main but no-ops unless a Release PR merge
  # introduced a new version (release_always = false); merging that PR is the human gate.
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the git tag + GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: fprintd
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz reads the full tag history to derive the bump
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Refresh the package index
        run: sudo apt-get update
      - name: Install native library development packages
        run: sudo apt-get install -y libfprint-2-dev libclang-dev pkg-config
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Open/update the Release PR. Same App token so the PR retriggers CI.
  release-plz-pr:
    name: release-plz pr
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # fetch the proposal credentials from Doppler
      contents: write # prepare release commits
      pull-requests: write # update the release proposal
    # Serialize PR updates; a second push must not race the first. cancel-in-progress is false.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: fprintd
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Refresh the package index
        run: sudo apt-get update
      - name: Install native library development packages
        run: sudo apt-get install -y libfprint-2-dev libclang-dev pkg-config
      - uses: release-plz/action@8b5bf233ecb5779f63508db7cd050e948ee77cc2 # v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
